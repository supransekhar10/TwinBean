[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "twinbean-backend"
version = "0.1.0"
description = "TwinBean doctor-authorized API skeleton"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.117,<1",
  "firebase-admin>=7,<8",
  "httpx>=0.28,<1",
  "pandas==3.0.6",
  "python-dotenv>=1,<2",
  "reportlab>=4,<5",
  "scikit-learn==1.9.1",
  "shap==0.52.0",
  "uvicorn[standard]>=0.35,<1",
  "xgboost==3.4.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
